name: CI
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Restore dependency wheels
        id: wheels
        uses: actions/cache@v4
        with:
          path: .wheels
          key: wheels-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements.lock') }}
      - name: Download wheels on cache miss
        if: steps.wheels.outputs.cache-hit != 'true'
        run: >-
          python -m pip download --only-binary=:all: -r requirements.txt -r requirements.lock -d .wheels
      - name: Install from wheels
        run: python -m pip install --no-index --find-links=.wheels -r requirements.txt -r requirements.lock
      - name: Estimate failure probability
        run: python ml/predict.py
      - name: Run tests
        id: tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eo pipefail
          python scripts/route_tests.py --base "$BASE_SHA" > "$RUNNER_TEMP/tests.txt"
          mapfile -t targets < "$RUNNER_TEMP/tests.txt"
          printf 'Test target %s\n' "${targets[@]}"
          pytest "${targets[@]}" 2>&1 | tee build.log
      - name: Summarize the test failure locally
        if: failure() && steps.tests.outcome == 'failure' && hashFiles('build.log') != ''
        run: bash scripts/run_log_model.sh build.log >> "$GITHUB_STEP_SUMMARY"
      - name: Replay the recorded failure with the local LLM
        if: github.event_name == 'workflow_dispatch' && success()
        run: bash scripts/run_log_model.sh evidence/4-4/failed-pytest.log >> "$GITHUB_STEP_SUMMARY"
